<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketplace — CampusMarket</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-config.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen antialiased" data-page="marketplace">

<!-- ===================== HEADER ===================== -->
<header class="sticky top-0 w-full z-50 bg-surface-container-lowest/95 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]">
  <div class="max-w-6xl mx-auto px-4 flex flex-col gap-2 py-2">
    <div class="flex items-center justify-between gap-3">
      <a href="index.html" class="shrink-0"><img src="assets/logo.svg" alt="CampusMarket logo" class="h-9 w-auto"></a>
      <nav class="hidden md:flex items-center gap-6 font-label-md text-label-md text-on-surface-variant">
        <a href="index.html" class="hover:text-primary-container">Home</a>
        <a href="marketplace.html" class="text-primary-container font-semibold">Marketplace</a>
        <a href="register.html" class="hover:text-primary-container">Sell an Item</a>
      </nav>
      <a href="cart.html" class="relative w-11 h-11 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors">
        <span class="material-symbols-outlined text-[24px]">shopping_bag</span>
        <span data-cart-badge class="absolute top-1.5 right-1.5 min-w-[18px] h-[18px] bg-primary-container text-on-primary font-label-sm text-[10px] leading-none rounded-full flex items-center justify-center font-bold px-1">0</span>
      </a>
    </div>
    <form data-search-form class="flex items-center gap-2">
      <div class="flex-1 flex items-center bg-surface-container-low rounded-xl px-3 h-11">
        <span class="material-symbols-outlined text-on-surface-variant text-[20px] mr-2">search</span>
        <input type="search" placeholder="Search electronics, textbooks, sneakers..." class="w-full bg-transparent border-none outline-none font-body-sm text-body-sm h-full">
      </div>
      <button type="submit" class="h-11 px-4 rounded-xl bg-primary-container text-on-primary font-label-md text-label-md shrink-0">Search</button>
    </form>
  </div>
</header>

<main class="flex-1 w-full">
  <div class="max-w-6xl mx-auto px-4 py-6">
    <div class="flex flex-col md:flex-row gap-6">

      <!-- ===================== FILTER SIDEBAR ===================== -->
      <aside class="w-full md:w-64 shrink-0 flex flex-col gap-5">
        <div class="bg-surface-container-lowest rounded-xl shadow-sm p-4 flex flex-col gap-4">
          <div>
            <label class="font-label-md text-label-md block mb-1.5">Category</label>
            <select data-filter-category class="w-full border border-outline-variant rounded-lg px-3 py-2 bg-white font-body-sm text-body-sm">
              <option value="all">All Categories</option>
              <option value="electronics">Electronics</option>
              <option value="fashion">Fashion</option>
              <option value="books">Books &amp; Study</option>
              <option value="stationery">Stationery</option>
            </select>
          </div>

          <div>
            <label class="font-label-md text-label-md block mb-1.5">Condition</label>
            <select data-filter-condition class="w-full border border-outline-variant rounded-lg px-3 py-2 bg-white font-body-sm text-body-sm">
              <option value="all">All Conditions</option>
              <option value="Brand New">Brand New</option>
              <option value="Used - Like New">Used - Like New</option>
              <option value="Used - Good">Used - Good</option>
              <option value="Used - Excellent">Used - Excellent</option>
              <option value="Used - Clean">Used - Clean</option>
              <option value="Refurbished">Refurbished</option>
            </select>
          </div>

          <form data-price-form class="flex flex-col gap-2">
            <label class="font-label-md text-label-md block">Price range (KSh)</label>
            <div class="flex items-center gap-2">
              <input type="number" name="minPrice" min="0" placeholder="Min" class="w-1/2 border border-outline-variant rounded-lg px-2.5 py-2 font-body-sm text-body-sm">
              <input type="number" name="maxPrice" min="0" placeholder="Max" class="w-1/2 border border-outline-variant rounded-lg px-2.5 py-2 font-body-sm text-body-sm">
            </div>
            <button type="submit" class="w-full bg-surface-container-high text-on-surface py-2 rounded-lg font-label-md text-label-md">Apply</button>
          </form>

          <button data-clear-filters class="text-primary-container font-label-md text-label-md text-left hover:underline">Clear all filters</button>
        </div>
      </aside>

      <!-- ===================== PRODUCT GRID ===================== -->
      <div class="flex-1 flex flex-col gap-4">
        <div class="flex items-center justify-between flex-wrap gap-2">
          <span data-result-count class="font-body-sm text-body-sm text-on-surface-variant">Loading products…</span>
          <div class="flex items-center gap-2">
            <label for="filterSearch" class="sr-only">Filter products by name</label>
            <input id="filterSearch" data-filter-search type="search" placeholder="Filter products by name..." class="border border-outline-variant rounded-lg px-3 py-2 font-body-sm text-body-sm w-44 sm:w-56">
            <select data-filter-sort class="border border-outline-variant rounded-lg px-3 py-2 font-body-sm text-body-sm">
              <option value="newest">Newest</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
            </select>
          </div>
        </div>

        <div data-catalog-grid class="grid grid-cols-2 lg:grid-cols-3 gap-4"></div>

        <div data-empty-state class="empty-state hidden">
          <span class="material-symbols-outlined text-[40px] text-outline">search_off</span>
          <p class="font-title-md text-title-md mt-2">No products match your filters</p>
          <p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Try widening your price range or clearing a filter.</p>
          <button data-empty-clear class="mt-3 bg-primary-container text-on-primary px-4 py-2 rounded-lg font-label-md text-label-md">Clear filters</button>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="bg-surface-container-low mt-6">
  <div class="max-w-6xl mx-auto px-4 py-8 flex flex-col md:flex-row items-center justify-between gap-4">
    <img src="assets/logo.svg" alt="CampusMarket logo" class="h-8 w-auto">
    <span class="font-body-sm text-body-sm text-outline">© 2026 CampusMarket · CCS 2314 Project</span>
  </div>
</footer>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/nav.js"></script>
<script src="js/marketplace.js"></script>
</body>
</html>
